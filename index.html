<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Trader – Stock Market Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef2f1;--sf:#fff;--tx:#14201e;--mu:#62706d;--ln:#d5dedb;--up:#0f8a6a;--dn:#d4463a;--ac:#1b4d6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1716;--sf:#182321;--tx:#e6eeec;--mu:#8fa09c;--ln:#2a3a37;--up:#3ccf9f;--dn:#ff7a6e;--ac:#7cc0e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716;--sf:#182321;--tx:#e6eeec;--mu:#8fa09c;--ln:#2a3a37;--up:#3ccf9f;--dn:#ff7a6e;--ac:#7cc0e6;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;max-width:760px;margin:0 auto;padding:14px}
h1{font:700 22px/1.2 "Georgia",serif;margin:0}
h2{font:600 15px/1.2 "Georgia",serif;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sub{color:var(--mu);font-size:13px}
.worth{text-align:right}
.worth b{font:700 24px/1 Georgia,serif;display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:16px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button.buy{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}
button.sell{background:var(--dn);border-color:var(--dn);color:#fff;font-weight:600}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr;align-items:center;padding:10px 4px;border-bottom:1px solid var(--ln);cursor:pointer;gap:6px}
.row:last-child{border:0}
.row.sel{background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:8px}
.row small{color:var(--mu);display:block;font-size:12px}
.r{text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
svg{width:100%;height:190px;display:block}
.trade{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
input[type=number]{width:90px;font:inherit;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.news{font-size:13px;padding:6px 0;border-bottom:1px solid var(--ln)}
.news:last-child{border:0}
.news.tip{border-left:3px solid var(--ac);padding-left:8px}
.news.mkt{color:var(--mu);font-style:italic}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;padding-bottom:2px}
.chips button{padding:6px 10px;min-height:34px;font-size:13px;white-space:nowrap}
.cat{font:600 12px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:12px 4px 4px}
select{font:inherit;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);min-height:40px;max-width:100%}
.watch{background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.msg{min-height:20px;font-size:13px;color:var(--mu);margin-top:6px}
.empty{color:var(--mu);font-size:13px}
.post{padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}
.post:last-child{border:0}
.post b{font-size:13px}
.post small{color:var(--mu);font-size:12px;display:block;margin-top:2px}
.pill{white-space:nowrap;border:1px solid var(--ln);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="top">
  <div><h1>Paper Trader</h1><div class="sub" id="day">Day 1</div></div>
  <div class="worth"><b id="nw">$10,000</b><span class="sub" id="pl">Net worth</span></div>
</div>

<div class="card">
  <div class="stats">
    <div><span class="sub">Cash</span><b id="cash"></b></div>
    <div><span class="sub">Invested</span><b id="inv"></b></div>
    <div><span class="sub">Best holding</span><b id="best">–</b></div>
  </div>
</div>

<div class="card ctl">
  <button id="pp" class="on">Pause</button>
  <button data-m="slow" class="on sp">Slow</button>
  <button data-m="norm" class="sp">Normal</button>
  <button data-m="fast" class="sp">Fast</button>
  <button data-m="live" class="sp">Live</button>
  <button id="rs" style="margin-left:auto">Reset</button>
</div>

<div class="card">
  <h2>Market</h2>
  <div class="chips" id="chips">
    <button data-c="All" class="on">All</button><button data-c="Stock">Stocks</button><button data-c="Index">Index</button><button data-c="Bond">Bonds</button><button data-c="REIT">Real estate</button><button data-c="Commodity">Commodities</button><button data-c="Crypto">Crypto</button>
  </div>
  <div class="chips" id="ichips" style="display:none">
    <button data-g="All" class="on">All industries</button><button data-g="Energy">Energy</button><button data-g="Technology">Technology</button><button data-g="Consumer">Consumer</button><button data-g="Healthcare">Healthcare</button><button data-g="Industrials">Industrials</button>
  </div>
  <div id="list"></div>
</div>

<div class="card">
  <h2 id="ct">Chart</h2>
  <svg id="ch" viewBox="0 0 600 190" preserveAspectRatio="none" role="img" aria-label="Price chart"></svg>
  <div class="trade">
    <input id="qty" type="number" min="1" value="10" aria-label="Shares">
    <button class="buy" id="b">Buy</button>
    <button class="sell" id="s">Sell</button>
    <button id="mx">Max</button>
  </div>
  <div class="msg" id="msg">Tap a stock above, pick a share count, then buy or sell.</div>
</div>

<div class="card">
  <h2>Social feed</h2>
  <div id="trend" class="chips"></div>
  <div id="social"></div>
</div>

<div class="card">
  <h2>Your holdings</h2>
  <div id="hold"></div>
  <div id="alloc"></div>
  <div id="alloc2"></div>
</div>

<div class="card">
  <h2>Orders</h2>
  <div class="trade" style="margin-top:0">
    <select id="otype" aria-label="Order type"><option value="lb">Buy if price falls to</option><option value="ls">Sell if price rises to</option><option value="sl">Stop-loss: sell if price falls to</option></select>
    <input id="oprice" type="number" step="0.01" min="0.01" style="width:110px" aria-label="Trigger price">
    <button id="oadd">Place order</button>
  </div>
  <div class="msg" id="omsg">Uses the selected stock and the share count above.</div>
  <div id="orders"></div>
</div>

<div class="card">
  <h2>Net worth vs. market index</h2>
  <svg id="nwc" viewBox="0 0 600 150" preserveAspectRatio="none" style="height:150px" role="img" aria-label="Net worth compared with the market index"></svg>
  <div class="sub" id="nwl"></div>
</div>

<div class="card">
  <h2>Tip scoreboard</h2>
  <div id="score"></div>
</div>

<div class="card">
  <h2>News and trades</h2>
  <div id="tips"></div>
  <div id="feed"></div>
</div>

<script>
const START=10000;
const DEF=[
 {t:"NOVA",n:"Nova Energy",g:"Energy",p:48,v:.016,d:.0002},
 {t:"SOLR",n:"Solara Power",g:"Energy",p:36,v:.018,d:.0002},
 {t:"PIXL",n:"Pixelworks",g:"Technology",p:132,v:.026,d:.0003},
 {t:"NIMB",n:"Nimbus Cloud",g:"Technology",p:88,v:.022,d:.0003},
 {t:"BREW",n:"Corner Brew Co.",g:"Consumer",p:22,v:.010,d:.0001},
 {t:"THRD",n:"Threadly Apparel",g:"Consumer",p:41,v:.015,d:.0001},
 {t:"MEDI",n:"MediCore",g:"Healthcare",p:95,v:.014,d:.0002},
 {t:"GENX",n:"GenePath Labs",g:"Healthcare",p:64,v:.024,d:.0003},
 {t:"AERO",n:"AeroLift",g:"Industrials",p:76,v:.020,d:.0002},
 {t:"RAIL",n:"IronRail Freight",g:"Industrials",p:54,v:.012,d:.0001},
 {t:"GLDX",n:"Gold Exchange",k:"Commodity",p:310,v:.008,d:.00005,m:-.3},
 {t:"SLVR",n:"Silver Bullion",k:"Commodity",p:28,v:.014,d:.00005,m:-.2},
 {t:"OILX",n:"Crude Oil Futures",k:"Commodity",p:78,v:.018,d:.0001,m:.3},
 {t:"COPR",n:"Copper Futures",k:"Commodity",p:4.2,v:.016,d:.0001,m:.6},
 {t:"WHET",n:"Wheat Futures",k:"Commodity",p:6.1,v:.017,d:.0001,m:.1},
 {t:"MKT",n:"Total Market Index",k:"Index",p:100,v:0,d:0},
 {t:"BOND",n:"Treasury Bond Fund",k:"Bond",p:100,v:.003,d:.00015,m:-.6},
 {t:"REIT",n:"Real Estate Trust",k:"REIT",p:58,v:.008,d:.00015,m:.6},
 {t:"COIN",n:"Cryptex",k:"Crypto",p:1200,v:.055,d:.0004,m:1.5}
];
const EVENTS=[
 ["beats earnings",.07],["announces a new product",.05],["wins a big contract",.06],
 ["misses earnings",-.07],["faces a lawsuit",-.06],["recalls a product",-.08],
 ["is upgraded by analysts",.04],["is downgraded by analysts",-.04]
];
const SOURCES=[["Analyst note",.8],["Insider chatter",.6],["Social buzz",.4]];
let S,timer,mode="slow",paused=false,sel=0,cat="All",ind="All";
const $=id=>document.getElementById(id);
const $f=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const rnd=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

function init(){
  S={t:0,tk:0,dn:0,orders:[],score:{},posts:[],buzz:{},fade:[],cash:START,mood:0,feed:[],pend:[],nwHist:[START],
    stk:DEF.map(d=>({k:"Stock",...d,h:Array.from({length:40},()=>d.p),open:d.p,sh:0,cost:0}))};
  S.stk.forEach(s=>{for(let i=1;i<40;i++){s.h[i]=Math.max(1,s.h[i-1]*(1+s.v*.6*rnd()))}s.p=s.h[39];s.open=s.p});
  S.ixHist=[S.stk.find(s=>s.k=="Index").p];
  draw();
}
const MODES={slow:{ms:1000,tpd:30,nv:6,every:1,tf:.4},norm:{ms:500,tpd:20,nv:6,every:1,tf:1},fast:{ms:100,tpd:20,nv:6,every:1,tf:3},live:{ms:1000,tpd:3600,nv:25,every:10,tf:.05}};
const CEV=[["is hyped across social media",.15],["faces a regulatory crackdown",-.18],["gets a major exchange listing",.12],["suffers an exchange hack",-.15]];
const stamp=()=>"Day "+(Math.floor(S.t)+1);
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const HINTS={
"beats earnings":["{n} channel checks look strong ahead of earnings","whisper numbers for {n} are running hot","{n} staff are reportedly ordering celebratory pizza"],
"announces a new product":["{n} was spotted teasing a product launch","a mystery unveiling is planned at {n} HQ","{n} just trademarked something nobody can explain"],
"wins a big contract":["{n} is said to be finalizing a major contract","procurement officials keep visiting {n}","{n} execs were seen shaking hands in a parking garage"],
"is upgraded by analysts":["a big bank is preparing to upgrade {n}","{n} is about to get a fresh buy rating","three analysts quietly raised their {n} targets"],
"misses earnings":["{n} inventories are piling up before earnings","whisper numbers for {n} look shaky","{n} cancelled its holiday party, and people are talking"],
"faces a lawsuit":["lawyers were seen entering {n} offices","a class action against {n} may be filed","{n} just hired an unusually large legal team"],
"recalls a product":["{n} suppliers report quality problems","a safety recall may be coming at {n}","customers are posting alarming photos of {n} gear"],
"is downgraded by analysts":["{n} is on a downgrade watchlist","a major bank is rethinking its {n} rating","an analyst skipped the {n} lunch and left early"],
"is hyped across social media":["influencers are suddenly all posting about {n}","{n} memes are everywhere","a celebrity just mentioned {n} on a livestream"],
"faces a regulatory crackdown":["regulators are circling {n}","a hearing about {n} was just scheduled","a draft rule could hit {n} hard"],
"gets a major exchange listing":["{n} is rumored to be heading to a big exchange","an exchange listing for {n} looks close","a top exchange just hired a {n} liaison"],
"suffers an exchange hack":["security researchers flag odd {n} wallet activity","strange withdrawals spotted around {n}","a {n} exchange is mysteriously offline for maintenance"]
};
const LEAD={"Analyst note":["Research desk:","Morning note:","Analyst flag:"],"Insider chatter":["Overheard at a steakhouse lunch:","An anonymous exec whispers:","Leaked memo suggests:"],"Social buzz":["Trending now:","The group chat is buzzing:","A viral post claims:"]};
const HIT=["Tip confirmed.","The rumor mill got this one right.","Whoever leaked that deserves a raise.","Called it."];
const MISS=["the rumor fizzled out.","turns out it was just hot air.","the story fell flat and nothing happened.","somebody's group chat got it wrong."];
const FLASH=["Breaking:","Out of nowhere:","Flash alert:","Stop the presses:"];
const MACRO=[["Central bank hints at rate cuts",.004],["Inflation report runs hotter than expected",-.004],["Consumer confidence hits a new high",.003],["Oil prices spike after a pipeline outage",-.003],["A big tech conference sparks optimism",.002],["Trade tensions flare up again",-.004],["Jobs report beats forecasts",.003],["Traders shrug off a quiet day",0],["Analysts argue over whether coffee is a leading indicator",0]];
function tipHeadline(src,s,e){const t=pickOne(HINTS[e[0]]||["{n} is in the spotlight"]).replace(/\{n\}/g,s.n);return pickOne(LEAD[src[0]])+" "+t[0].toUpperCase()+t.slice(1);}
function bump(s,k){
  s.p=Math.max(.5,s.p*(1+k));
  const x=S.stk.find(q=>q.k=="Index");
  if(s.k=="Stock"&&x)x.p*=1+k/S.stk.filter(q=>q.k=="Stock").length;
}
function pick(){const a=S.stk.map((s,i)=>i).filter(i=>S.stk[i].k=="Stock"||S.stk[i].k=="Crypto"||S.stk[i].k=="Commodity");const c=a.filter(i=>!S.pend.some(p=>p.i==i));const z=c.length?c:a;return z[Math.floor(Math.random()*z.length)]}
function tick(){
  const M=MODES[mode],dt=1/M.tpd,sq=Math.sqrt(dt);
  S.tk++;S.t+=dt;
  const dn=Math.floor(S.t+1e-9);
  if(dn>S.dn){S.dn=dn;S.stk.forEach(s=>s.open=s.p)}
  S.mood+=-.05*S.mood*dt+.003*sq*rnd();
  let rs=0,ns=0;
  S.stk.forEach(s=>{
    if(s.k=="Index")return;
    const r=s.d*dt+S.mood*dt*(s.m??1)+s.v*sq*rnd();
    s.p=Math.max(.5,s.p*(1+r));
    if(s.k=="Stock"){rs+=r;ns++}
    if(s.k=="Crypto"&&Math.random()<.4*dt)bump(s,(Math.random()-.5)*.2);
  });
  const ix=S.stk.find(s=>s.k=="Index");
  if(ix&&ns)ix.p*=1+rs/ns;
  const due=S.pend.filter(p=>p.due<=S.t);
  S.pend=S.pend.filter(p=>p.due>S.t);
  due.forEach(p=>{
    const s=S.stk[p.i],sc=S.score[p.src]||(S.score[p.src]={n:0,hit:0});
    sc.n++;
    if(Math.random()<p.rel){
      sc.hit++;
      bump(s,p.k);
      log(`${stamp()}: ${s.n} ${p.e} (${p.k>0?"+":""}${(p.k*100).toFixed(1)}%). ${pickOne(HIT)}`,p.k>0?"up":"dn");
      ripple(s,p.k,p.e);
    }else log(`${stamp()}: ${s.t}: ${pickOne(MISS)}`);
  });
  if(Math.random()<M.ms/1000/M.nv){
    const i=pick(),s=S.stk[i];
    if(!S.pend.some(p=>p.i==i)){
      const E=evs(s),e=E[Math.floor(Math.random()*E.length)];
      const src=SOURCES[Math.floor(Math.random()*SOURCES.length)];
      const k=e[1]*(.6+Math.random()*.8);
      S.pend.push({i,e:e[0],k,rel:src[1],src:src[0],due:S.t+(.5+Math.random()*2.5)*M.tf});
      log(`${stamp()}: ${tipHeadline(src,s,e)} (${Math.round(src[1]*100)}% reliable)`,"tip");
    }
  }
  if(Math.random()<M.ms/1000/(M.nv*4)){
    const s=S.stk[pick()],E=evs(s),e=E[Math.floor(Math.random()*E.length)],k=e[1]*(.6+Math.random()*.8);
    bump(s,k);
    log(`${stamp()}: ${pickOne(FLASH)} ${s.n} ${e[0]} (${k>0?"+":""}${(k*100).toFixed(1)}%)`,k>0?"up":"dn");
    ripple(s,k,e[0]);
  }
  if(Math.random()<M.ms/1000/(M.nv*2)){const m=pickOne(MACRO);S.mood+=m[1];log(`${stamp()}: Market wrap: ${m[0]}.`,"mkt")}
  if(Math.random()<M.ms/1000/(M.nv*3)){const e=pickOne(SECT);S.stk.forEach(s=>{if(s.g==e[0])bump(s,e[2]*(.7+Math.random()*.6))});log(`${stamp()}: Sector watch: ${e[1]} (${e[0]})`,e[2]>0?"up":"dn");
    (SX[e[0]]||[]).forEach(([t,w])=>{const h=S.stk.filter(s=>s.g==t||s.k==t),m=e[2]*w*(.7+Math.random()*.6);if(!h.length)return;h.forEach(s=>bump(s,m*(.8+Math.random()*.4)));log(`${stamp()}: Ripple effect: ${t} ${m>0?"rises":"falls"} in sympathy with ${e[0]} (${m>0?"+":""}${(m*100).toFixed(1)}%)`,m>0?"up":"dn")})}
  social(M);
  checkOrders();
  const push=S.tk%M.every==0;
  S.stk.forEach(s=>{if(push)s.h.push(s.p);else s.h[s.h.length-1]=s.p;if(s.h.length>120)s.h.shift()});
  if(S.tk%M.every==0){S.nwHist.push(netWorth());S.ixHist.push(S.stk.find(s=>s.k=="Index").p);if(S.nwHist.length>300){S.nwHist.shift();S.ixHist.shift()}}
  draw();
}
function netWorth(){return S.cash+S.stk.reduce((a,s)=>a+s.sh*s.p,0)}
function log(t,c){S.feed.unshift([t,c||""]);if(S.feed.length>30)S.feed.pop()}
function say(t){$("msg").textContent=t}

function trade(side){
  const s=S.stk[sel],q=Math.floor(+$("qty").value);
  if(!(q>0))return say("Enter a whole number of shares.");
  if(side=="b"){
    const c=q*s.p;
    if(c>S.cash)return say(`Not enough cash. You can afford ${Math.floor(S.cash/s.p)} shares.`);
    S.cash-=c;s.cost+=c;s.sh+=q;
    log(`Bought ${q} ${s.t} at ${$f(s.p)}`);say(`Bought ${q} ${s.t} for ${$f(c)}.`);
  }else{
    if(q>s.sh)return say(`You only hold ${s.sh} shares of ${s.t}.`);
    const avg=s.cost/s.sh;
    S.cash+=q*s.p;s.cost-=avg*q;s.sh-=q;if(!s.sh)s.cost=0;
    const g=(s.p-avg)*q;
    log(`Sold ${q} ${s.t} at ${$f(s.p)} (${g>=0?"+":""}${$f(g)})`,g>=0?"up":"dn");
    say(`Sold ${q} ${s.t} for ${$f(q*s.p)}.`);
  }
  draw();
}

const CATN={Stock:"Stocks",Index:"Index funds",Bond:"Bonds",REIT:"Real estate",Commodity:"Commodities",Crypto:"Crypto"};
function allocList(){
  const by={};let t=0;
  S.stk.forEach(s=>{if(s.sh){by[s.k]=(by[s.k]||0)+s.sh*s.p;t+=s.sh*s.p}});
  const ks=Object.keys(by);
  const gi={};S.stk.forEach(s=>{if(s.sh&&s.g)gi[s.g]=(gi[s.g]||0)+s.sh*s.p});
  const gs=Object.keys(gi),sT=gs.reduce((a,k)=>a+gi[k],0);
  $("alloc2").innerHTML=gs.length?`<div class="sub">By industry: ${gs.map(k=>k+" "+Math.round(gi[k]/sT*100)+"%").join(", ")}</div>`:"";
  $("alloc").innerHTML=ks.length?`<div class="sub" style="margin-top:8px">By category: ${ks.map(k=>CATN[k]+" "+Math.round(by[k]/t*100)+"%").join(" \u00b7 ")}</div>`:"";
}
const SECT=[["Energy","Oil supply shock lifts energy producers",.04],["Energy","Clean-energy subsidies announced",.035],["Energy","Energy demand slumps as winter eases",-.035],["Technology","Chip shortage eases across tech",.04],["Technology","Antitrust probe targets big tech",-.045],["Technology","AI spending boom lifts the sector",.05],["Consumer","Holiday spending beats expectations",.035],["Consumer","Consumer spending slows sharply",-.04],["Healthcare","New health bill boosts the sector",.035],["Healthcare","Drug pricing crackdown spooks investors",-.045],["Industrials","Infrastructure bill passes",.04],["Industrials","Supply chain snarls hit manufacturers",-.035]];
const LINKS=[["NOVA","SOLR","rival",.35],["PIXL","NIMB","rival",.35],["BREW","THRD","rival",.3],["MEDI","GENX","rival",.3],["AERO","RAIL","rival",.3],["NOVA","AERO","partner",.3],["PIXL","COIN","partner",.25],["THRD","RAIL","partner",.25],["SOLR","NIMB","partner",.25],["COIN","GLDX","rival",.2],["COIN","NIMB","partner",.2],["GLDX","BOND","partner",.2],["REIT","BOND","rival",.2],["OILX","NOVA","partner",.3],["OILX","AERO","rival",.25],["COPR","RAIL","partner",.2],["WHET","BREW","rival",.2],["SLVR","GLDX","partner",.3]];
const CMEV=[["jumps on supply worries",.08],["tumbles on weak demand",-.08],["surges on a cold snap",.06],["slides as stockpiles grow",-.06]];
Object.assign(HINTS,{"jumps on supply worries":["{n} traders are bracing for a supply squeeze","a shipping delay could tighten {n} supply"],"tumbles on weak demand":["{n} buyers are suddenly pulling back","warehouse orders for {n} look soft"],"surges on a cold snap":["forecasters see a cold snap boosting {n} demand","{n} desks expect a weather-driven rush"],"slides as stockpiles grow":["{n} stockpiles are rising faster than expected","storage tanks for {n} are filling up"]});
const evs=s=>s.k=="Crypto"?CEV:s.k=="Commodity"?CMEV:EVENTS;
const SX={Energy:[["Consumer",-.4],["Industrials",-.4]],Technology:[["Crypto",.5]],Consumer:[["REIT",.3]],Healthcare:[["REIT",.2]],Industrials:[["Commodity",.3]]};
function ripple(s,k,ev,seen){
  seen=seen||[s.t];
  LINKS.forEach(([a,b,ty,w])=>{
    const oT=s.t==a?b:s.t==b?a:null;
    if(!oT||seen.includes(oT)||Math.random()>.6)return;seen.push(oT);
    const o=S.stk.find(x=>x.t==oT),m=k*w*(.7+Math.random()*.6)*(ty=="rival"?-1:1);
    bump(o,m);
    const msg=ty=="rival"?(k>0?`${o.n} slips as rival ${s.n} ${ev}`:`${o.n} gains as rival ${s.n} stumbles`):(k>0?`${o.n} edges up on good news at ${s.n}`:`${o.n} dips as trouble at ${s.n} spreads`);
    log(`${stamp()}: Ripple effect: ${msg} (${m>0?"+":""}${(m*100).toFixed(1)}%)`,m>0?"up":"dn");
    if(Math.abs(m)>.008&&Math.random()<.2)ripple(o,m,"moves",seen);
  });
}
const ACCTS=[["@bullrun_betty","hype",.4,180],["@diamond_dave","hype",.3,95],["@quiet_quant","analyst",.75,40],["@doomer_dan","bear",.4,130],["@old_money_olga","calm",.7,60],["@meme_machine","hype",.25,320]];
const BULL_H=["{t} to the moon 🚀 not financial advice","Just loaded up on {t}. Who’s with me?","{t} breakout incoming. Mark my words.","If you’re not in {t}, you’ll regret it"];
const BEAR_H=["{t} looks like a trap. Be careful out there.","Dumped all my {t}. Chart looks ugly.","{t} is overvalued and everyone knows it","Shorting {t}. See you at the bottom."];
const BULL_A=["{t}: fundamentals look solid, adding on dips.","Our model flags {t} as undervalued.","Steady accumulation in {t}. Patience pays."];
const BEAR_A=["{t}: risk/reward skews to the downside.","Trimming {t}. Valuation looks stretched.","Taking profits in {t} ahead of the news."];
const UPR=["{t} is ripping today, up {p}%","Called {t} last week. Told you so.","{t} +{p}% and I’m not done"];
const DNR=["{t} down {p}%. Ouch.","Who’s buying the {t} dip?","{t} bleeding today, {p}% lower"];
function social(M){
  S.fade=S.fade.filter(f=>{if(f.due>S.t)return true;const s=S.stk[f.i];bump(s,f.k);log(`${stamp()}: ${s.t} ${f.k<0?"cools off after the hype":"bounces back after the panic"} (${f.k>0?"+":""}${(f.k*100).toFixed(1)}%)`,f.k>0?"up":"dn");return false});
  if(Math.random()<M.ms/1000/(M.nv*.7))socialPost();
}
function socialPost(){
  const [h,sty,cred,fol]=pickOne(ACCTS),M=MODES[mode];
  const hot=Object.keys(S.buzz).sort((a,b)=>Math.abs(S.buzz[b])-Math.abs(S.buzz[a]))[0];
  let s,dir,mv=0,react=false;
  if(S.pend.length&&Math.random()<.3){
    const p=pickOne(S.pend);s=S.stk[p.i];dir=p.k>0?1:-1;if(Math.random()<(1-cred)*.5)dir=-dir;
  }else{
    s=hot&&Math.random()<.4?S.stk.find(x=>x.t==hot):pickOne(S.stk);
    mv=s.p/s.h[Math.max(0,s.h.length-8)]-1;
    if(Math.abs(mv)>.012&&Math.random()<.7){react=true;dir=mv>0?1:-1}
    else if(S.buzz[s.t]&&Math.random()<.6)dir=S.buzz[s.t]>0?1:-1;
    else dir=sty=="bear"?-1:sty=="hype"?(Math.random()<.8?1:-1):(Math.random()<.5?1:-1);
  }
  const pool=react?(dir>0?UPR:DNR):(sty=="hype"||sty=="bear")?(dir>0?BULL_H:BEAR_H):(dir>0?BULL_A:BEAR_A);
  const txt=pickOne(pool).replace(/\{t\}/g,s.t).replace(/\{p\}/g,Math.abs(mv*100).toFixed(1));
  S.posts.unshift({h,f:fol,txt,likes:Math.round(fol*10*(.15+Math.random()*.85))});if(S.posts.length>20)S.posts.pop();
  for(const k in S.buzz)S.buzz[k]*=.93;
  const w=fol/100*(react?.5:1);
  S.buzz[s.t]=(S.buzz[s.t]||0)+dir*w;
  bump(s,dir*.0012*w*(s.k=="Crypto"?2:1));
  if(Math.abs(S.buzz[s.t])>=4.5){
    const d=S.buzz[s.t]>0?1:-1,k=d*(.025+Math.random()*.03)*(s.k=="Crypto"?2:1);
    bump(s,k);S.buzz[s.t]=0;
    S.posts.unshift({h:"@MarketBuzz",f:900,txt:`${s.t} is going viral ${d>0?"🚀":"📉"} Everyone is talking about it.`,likes:Math.round(9000*(.5+Math.random())),hot:1});
    log(`${stamp()}: Social media frenzy: ${s.n} ${d>0?"surges":"plunges"} as ${d>0?"hype":"panic"} spreads (${k>0?"+":""}${(k*100).toFixed(1)}%)`,k>0?"up":"dn");
    S.fade.push({i:S.stk.indexOf(s),k:-k*.6,due:S.t+(.4+Math.random()*.6)*M.tf});
    ripple(s,k);
  }
}
function socialList(){
  const tr=Object.entries(S.buzz).filter(([k,v])=>Math.abs(v)>=1).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,4);
  $("trend").innerHTML=tr.length?tr.map(([k,v])=>`<span class="pill ${v>0?"up":"dn"}">${v>0?"\u25b2":"\u25bc"} ${k}</span>`).join(""):`<span class="sub">Nothing trending yet</span>`;
  $("social").innerHTML=S.posts.length?S.posts.map(p=>`<div class="post"><b>${p.h}</b> <span class="sub">· ${p.f}K followers</span><div>${p.txt}</div><small>\u2665 ${p.likes>=1000?(p.likes/1000).toFixed(1)+"K":p.likes}${p.hot?" · 🔥 viral":""}</small></div>`).join(""):`<div class="empty">Posts will appear here.</div>`;
}
let OID=0,lastOrd="x";
function fill(s,side,q){
  if(side=="b"){
    q=Math.min(q,Math.floor(S.cash/s.p));if(q<1)return 0;
    S.cash-=q*s.p;s.cost+=q*s.p;s.sh+=q;
  }else{
    q=Math.min(q,s.sh);if(q<1)return 0;
    const avg=s.cost/s.sh;S.cash+=q*s.p;s.cost-=avg*q;s.sh-=q;if(!s.sh)s.cost=0;
  }
  return q;
}
function checkOrders(){
  if(!S.orders.length)return;
  S.orders=S.orders.filter(o=>{
    const s=S.stk[o.i],hit=o.type=="ls"?s.p>=o.price:s.p<=o.price;
    if(!hit)return true;
    const side=o.type=="lb"?"b":"s",q=fill(s,side,o.qty),nm={lb:"Limit buy",ls:"Limit sell",sl:"Stop-loss"}[o.type];
    log(q?`${stamp()}: ${nm} filled: ${side=="b"?"bought":"sold"} ${q} ${s.t} at ${$f(s.p)}`:`${stamp()}: ${nm} on ${s.t} cancelled (${side=="b"?"not enough cash":"no shares left"})`,q?(o.type=="sl"?"dn":"up"):"");
    return false;
  });
}
function placeOrder(){
  const s=S.stk[sel],q=Math.floor(+$("qty").value),pr=+$("oprice").value,t=$("otype").value,m=$("omsg");
  if(!(q>0)||!(pr>0)){m.textContent="Enter a share count above and a trigger price.";return}
  if(t!="ls"&&pr>=s.p){m.textContent=`Trigger must be below the current price (${$f(s.p)}).`;return}
  if(t=="ls"&&pr<=s.p){m.textContent=`Trigger must be above the current price (${$f(s.p)}).`;return}
  if(t!="lb"&&q>s.sh){m.textContent=`You only hold ${s.sh} shares of ${s.t}.`;return}
  S.orders.push({id:++OID,i:sel,type:t,price:pr,qty:q});
  m.textContent="Order placed. It fills automatically when the price is hit.";
  draw();
}
function orderList(){
  $("oprice").placeholder=$f(S.stk[sel].p);
  const k=S.orders.map(o=>o.id).join(",");
  if(k===lastOrd)return;lastOrd=k;
  const nm={lb:"Buy",ls:"Sell",sl:"Stop-loss sell"};
  $("orders").innerHTML=S.orders.length?S.orders.map(o=>{const s=S.stk[o.i];return `<div class="row" style="cursor:default"><div><b>${nm[o.type]} ${o.qty}</b><small>${s.t}</small></div><div class="r">${o.type=="ls"?"\u2265":"\u2264"} ${$f(o.price)}</div><div class="r"><button data-id="${o.id}">Cancel</button></div></div>`}).join(""):`<div class="empty">No open orders.</div>`;
}
function scoreList(){
  $("score").innerHTML=SOURCES.map(([n,r])=>{const c=S.score[n]||{n:0,hit:0};return `<div class="row" style="cursor:default"><div><b>${n}</b><small>says ${Math.round(r*100)}% reliable</small></div><div class="r">${c.hit} of ${c.n} right</div><div class="r"><b>${c.n?Math.round(c.hit/c.n*100)+"%":"\u2013"}</b></div></div>`}).join("");
}
function nwChart(){
  const a=S.nwHist,b=S.ixHist.map(v=>START*v/S.ixHist[0]);
  const W=600,H=150,pad=8,all=a.concat(b),mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn)||1;
  const path=arr=>arr.map((v,i)=>(i?"L":"M")+(arr.length>1?i/(arr.length-1)*W:0).toFixed(1)+" "+(H-pad-(v-mn)/rg*(H-2*pad)).toFixed(1)).join("");
  const y0=H-pad-(START-mn)/rg*(H-2*pad);
  $("nwc").innerHTML=`<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--ln)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><path d="${path(b)}" fill="none" stroke="var(--mu)" stroke-width="1.5" vector-effect="non-scaling-stroke"/><path d="${path(a)}" fill="none" stroke="var(--ac)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
  const me=a[a.length-1]/START*100-100,mk=b[b.length-1]/START*100-100;
  $("nwl").innerHTML=`<span style="color:var(--ac)">\u25cf You ${me>=0?"+":""}${me.toFixed(1)}%</span> &nbsp; <span>\u25cf Market index ${mk>=0?"+":""}${mk.toFixed(1)}%</span> &nbsp; <span class="${me>=mk?"up":"dn"}">${me>=mk?"Beating":"Trailing"} the market</span>`;
}
function chart(){
  const s=S.stk[sel],h=s.h,W=600,H=190,pad=10;
  const mn=Math.min(...h),mx=Math.max(...h),rg=(mx-mn)||1;
  const pts=h.map((v,i)=>[i/(h.length-1)*W,H-pad-(v-mn)/rg*(H-2*pad)]);
  const up=h[h.length-1]>=h[0],c=up?"var(--up)":"var(--dn)";
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  let g="";
  for(let i=0;i<4;i++){const y=pad+i*(H-2*pad)/3;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--ln)" stroke-width="1" vector-effect="non-scaling-stroke"/>`}
  let avg="";
  if(s.sh){const a=s.cost/s.sh;if(a>=mn&&a<=mx){const y=H-pad-(a-mn)/rg*(H-2*pad);avg=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--ac)" stroke-dasharray="6 5" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`}}
  $("ch").innerHTML=g+avg+`<path d="${line}L${W} ${H}L0 ${H}Z" fill="${c}" opacity=".1"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  $("ct").textContent=`${s.t} · ${s.n}`+(s.sh?" (dashed line = your average cost)":"");
}

function draw(){
  const nw=netWorth(),pl=nw-START;
  const dn=Math.floor(S.t)+1,fr=S.t%1;
  $("day").textContent=mode=="live"?`Live · ${new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})} · Day ${dn} (1 day = 1 real hour)`:`Day ${dn} · ${String(Math.floor(fr*24)).padStart(2,"0")}:00`;
  $("nw").textContent=$f(nw);
  $("pl").innerHTML=`<span class="${pl>=0?"up":"dn"}">${pl>=0?"+":""}${$f(pl)} (${(pl/START*100).toFixed(1)}%)</span>`;
  $("cash").textContent=$f(S.cash);
  $("inv").textContent=$f(nw-S.cash);
  let best=null;S.stk.forEach(s=>{if(s.sh){const g=s.p/(s.cost/s.sh)-1;if(!best||g>best.g)best={t:s.t,g}}});
  $("best").innerHTML=best?`${best.t} <span class="${best.g>=0?"up":"dn"}">${(best.g*100).toFixed(1)}%</span>`:"–";
  $("list").innerHTML=S.stk.map((s,i)=>{
    const ch=s.p/s.h[0]*100-100;const dc=s.p/s.open-1;
    const gk=x=>cat=="All"?x.k:x.g,show=cat=="All"||(cat=="Stock"&&ind=="All");
    const hd=show&&(i==0||S.stk[i-1].k!=s.k||gk(S.stk[i-1])!=gk(s))?`<div class="cat">${cat=="All"?CATN[s.k]:s.g}</div>`:"";
    if(cat!="All"&&s.k!=cat||cat=="Stock"&&ind!="All"&&s.g!=ind)return "";
    return hd+`<div class="row${i==sel?" sel":""}" data-i="${i}" tabindex="0" role="button">
      <div><b>${s.t}</b><small>${s.g||s.k} · ${s.n}</small></div>
      <div class="r"><b>${$f(s.p)}</b><small class="${dc>=0?"up":"dn"}">${dc>=0?"▲":"▼"} ${(Math.abs(dc)*100).toFixed(2)}%</small></div>
      <div class="r"><small>${s.sh?s.sh+" shares":"No shares"}</small></div></div>`}).join("");
  const hs=S.stk.filter(s=>s.sh);
  $("hold").innerHTML=hs.length?hs.map(s=>{
    const val=s.sh*s.p,g=val-s.cost;
    return `<div class="row" style="cursor:default"><div><b>${s.t}</b><small>${s.sh} @ ${$f(s.cost/s.sh)}</small></div><div class="r"><b>${$f(val)}</b></div><div class="r ${g>=0?"up":"dn"}">${g>=0?"+":""}${$f(g)}</div></div>`}).join(""):`<div class="empty">Nothing yet. You start with ${$f(START)} in cash.</div>`;
  $("tips").innerHTML=S.pend.length?`<div class="watch"><b>Tips to watch</b>`+S.pend.map(p=>{const s=S.stk[p.i],d=p.due-S.t,w=MODES[mode].tpd>=3600?Math.max(1,Math.ceil(d*60))+" min":Math.max(.1,d).toFixed(1)+" days";return `<div class="sub">${s.t}: ${p.k>0?"possible rise":"possible drop"} within ${w} · ${p.src}, ${Math.round(p.rel*100)}% reliable</div>`}).join("")+`</div>`:"";
  $("feed").innerHTML=S.feed.length?S.feed.map(f=>`<div class="news ${f[1]}">${f[0]}</div>`).join(""):`<div class="empty">News and your trades show up here.</div>`;
  chart();nwChart();orderList();scoreList();allocList();socialList();
}

function run(){clearInterval(timer);if(!paused)timer=setInterval(tick,MODES[mode].ms)}
$("list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r){sel=+r.dataset.i;draw()}});
$("list").addEventListener("keydown",e=>{if(e.key=="Enter"||e.key==" "){const r=e.target.closest(".row");if(r){e.preventDefault();sel=+r.dataset.i;draw()}}});
$("b").onclick=()=>trade("b");$("s").onclick=()=>trade("s");
$("mx").onclick=()=>{$("qty").value=Math.max(1,Math.floor(S.cash/S.stk[sel].p))};
$("pp").onclick=e=>{paused=!paused;e.target.textContent=paused?"Resume":"Pause";e.target.classList.toggle("on",!paused);run()};
document.querySelectorAll(".sp").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll(".sp").forEach(x=>x.classList.toggle("on",x==b));run();draw()});
$("rs").onclick=()=>{init();say("Reset. You have "+$f(START)+" to start.")};
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;ind="All";$("ichips").style.display=cat=="Stock"?"flex":"none";document.querySelectorAll("#ichips button").forEach(x=>x.classList.toggle("on",x.dataset.g=="All"));document.querySelectorAll("#chips button").forEach(x=>x.classList.toggle("on",x==b));if(cat!="All"&&S.stk[sel].k!=cat)sel=S.stk.findIndex(s=>s.k==cat);draw()});
document.querySelectorAll("#ichips button").forEach(b=>b.onclick=()=>{ind=b.dataset.g;document.querySelectorAll("#ichips button").forEach(x=>x.classList.toggle("on",x==b));if(ind!="All"&&S.stk[sel].g!=ind)sel=S.stk.findIndex(s=>s.g==ind);draw()});
$("oadd").onclick=placeOrder;
$("orders").addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.orders=S.orders.filter(o=>o.id!=+b.dataset.id);draw()}});
init();run();
</script>
